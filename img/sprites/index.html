<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sewer Demons — Painted Bestiary</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#181c19;color:#ece6d6;font:16px system-ui}h1{font:38px Georgia;margin:0 0 10px}p{color:#bcbcae}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{padding:10px 18px;border:1px solid #899277;background:#303c30;color:#fff;cursor:pointer;border-radius:4px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{border:1px solid #485044;border-radius:8px;overflow:hidden}figure{margin:0;aspect-ratio:1;background-color:#313b30;background-image:conic-gradient(#ffffff09 25%,transparent 0 50%,#ffffff09 0 75%,transparent 0);background-size:24px 24px;display:grid;place-items:center}img{width:100%;height:100%;object-fit:contain;padding:12px}h2{font:20px Georgia;margin:16px}a{color:inherit;text-decoration:none}body[data-bg="light"] figure{background:#dcd6c5}body[data-bg="dark"] figure{background:#111714}body[data-small="true"] img{width:128px;height:128px;padding:0}@media(max-width:850px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){main{grid-template-columns:1fr}body{padding:16px}}
</style><body><h1>Sewer Demons</h1><p>Painted bestiary · Eight transparent, full-body sprites · One pose per creature</p>
<nav aria-label="Preview settings"><button data-bg="checker">Checker</button><button data-bg="light">Light</button><button data-bg="dark">Dark</button><button id="size">Toggle 128px preview</button></nav>
<main><article><a href="enemy/rat.png"><figure><img src="enemy/rat.png" alt="rat" width="1254" height="1254"></figure><h2>Demon rat</h2></a></article>
<article><a href="enemy/ratman.png"><figure><img src="enemy/ratman.png" alt="ratman" width="1254" height="1254"></figure><h2>Rat-man</h2></a></article>
<article><a href="enemy/shitgolem.png"><figure><img src="enemy/shitgolem.png" alt="shitgolem" width="1254" height="1254"></figure><h2>Sewage golem</h2></a></article>
<article><a href="enemy/crawler.png"><figure><img src="enemy/crawler.png" alt="crawler" width="1254" height="1254"></figure><h2>Drain-crawler</h2></a></article>
<article><a href="enemy/drowned.png"><figure><img src="enemy/drowned.png" alt="drowned" width="1254" height="1254"></figure><h2>The drowned</h2></a></article>
<article><a href="enemy/grafted.png"><figure><img src="enemy/grafted.png" alt="grafted" width="1254" height="1254"></figure><h2>Grafted thing</h2></a></article>
<article><a href="enemy/gorger.png"><figure><img src="enemy/gorger.png" alt="gorger" width="1254" height="1254"></figure><h2>Gorger</h2></a></article>
<article><a href="enemy/pigdemon.png"><figure><img src="enemy/pigdemon.png" alt="pigdemon" width="1254" height="1254"></figure><h2>Pig-demon</h2></a></article></main>
<script>document.querySelectorAll('button[data-bg]').forEach(b=>b.onclick=()=>document.body.dataset.bg=b.dataset.bg);document.querySelector('#size').onclick=()=>document.body.dataset.small=document.body.dataset.small!=='true';</script></body></html>
